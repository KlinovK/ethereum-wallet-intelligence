[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "ethereum-wallet-intelligence"
version = "0.1.0"
description = "Backend service for Ethereum wallet intelligence"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "MIT" }
authors = [{ name = "KlinovK" }]
dependencies = [
    "alembic>=1.14,<2",
    "asyncpg>=0.30,<1",
    "fastapi>=0.115,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.15,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
    "uvicorn>=0.30,<1",
    "web3>=8,<9",
]

[project.optional-dependencies]
dev = [
    "aiosqlite>=0.20,<1",
    "httpx2>=2,<3",
    "mypy>=1.13,<2",
    "pytest>=8.3,<10",
    "ruff>=0.7,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ethereum_wallet_intelligence"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: marks tests as integration tests requiring external services (deselect with '-m \"not integration\"')",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
pretty = true
files = ["src", "tests"]
